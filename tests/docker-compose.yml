services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookhub_test
      POSTGRES_PASSWORD: bookhub_test
      POSTGRES_DB: bookhub_test
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookhub_test -d bookhub_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs: ["/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
